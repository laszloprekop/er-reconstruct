[package]
name = "er-reconstruct"
version = "0.1.0"
edition = "2021"
description = "Character Reconstructor — the shared reconstruction core (ADR-0010). Turns one slot of an Elden Ring save into facts, compiled native and WASM."
license = "MIT OR Apache-2.0"

[lib]
name = "er_reconstruct"
# rlib for the native reader (linked in-process); cdylib for the wasm-pack build
# elden-map consumes. The wasm-bindgen entry point is gated to wasm32, so native
# builds carry no wasm machinery.
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Dormant save write-back path, moved with the extracted `save/` code (ADR-0009).
# The core is a reader: it reconstructs facts and never serialises state back to
# bytes. The `Write` trait and its `impl`s live behind this flag so the extracted
# code keeps compiling, resurrectable, but out of the default build. `md5` is only
# reachable from that path (checksum recompute on write), so it is pulled in only
# by the feature. Keep it compiling: `cargo check --features save-writeback`.
save-writeback = ["dep:md5"]

[lints.clippy]
# Matches the source repo: `foo.rs` containing `pub mod foo { … }` is the layout
# used throughout the extracted `save/` code.
module_inception = "allow"

[dependencies]
# wasm-event-flags stays the canonical home in ER-save-Reader. The published crate
# references it by git so `er-reconstruct` resolves standalone; a consumer (this
# reader, elden-map) unifies it to its own copy with a `[patch]` on the same URL,
# so there is never a second wasm-event-flags in the graph (ADR-0010, Drift-proof).
# The `[patch]` at the bottom of this file applies only when `er-reconstruct` is
# the build root — i.e. standalone dev and tests here — and is ignored when it is a
# dependency, where the consumer's patch wins.
wasm-event-flags = { git = "https://github.com/laszloprekop/ER-save-Reader.git", branch = "master" }
binary-reader = "0.4.5"
# Minimal regulation slice: AES-CBC decrypt of the regulation blob, used only to
# recognise a PS Save Wizard save. The heavy param/BND4 machinery stays in the
# reader.
aes = "0.8.4"
cbc = "0.1.2"
# Facts are Serialize so the WASM boundary (and later consumers) can emit them as
# JSON; serde_json renders the string the wasm entry point returns.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Write-back only (feature-gated): MD5 checksums recomputed when serialising.
md5 = { version = "0.7.0", optional = true }

# wasm-pack build only: the JS boundary. Gated to wasm32 so the native reader
# never compiles wasm-bindgen.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
